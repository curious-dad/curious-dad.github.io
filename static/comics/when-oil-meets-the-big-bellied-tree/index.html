        ["After twenty years of comic-book over-researching, Jester Strong finally breeds a big-bellied tree that can exude oil.","搞笑强钻研二十年，终于培育出一种能流出“石油”的大肚子树。"],

        ["The thing he throws is a soda can—he grabbed the wrong item, and soda splashes all over Jester Strong.","大鼻子哆嗦着丢出去的，竟是个可乐罐——慌乱中拿错了，可乐洒了搞笑强一地。"],

        ["The fourth assassin is a green-haired hippie with a beard in three braids. He plans to lasso Jester Strong like a cowboy.","第四个杀手是绿头发、胡子扎成三条辫的嬉皮士，打算甩出牛仔套索把搞笑强套走。"],
        ["He reaches into his pocket but cannot find the lasso. After searching his whole body, it finally drops with a slap.","嬉皮士伸手掏口袋却摸不到套索，翻遍全身，套索才“啪嗒”一声掉在地上。"],

        ["With every trick foiled, the four assassins draw their guns, fire wildly into the air, and rush Jester Strong together.","暗算全失败，四个杀手索性掏枪朝天乱放，一齐扑向搞笑强。"],
        ["Jester Strong panics and circles the banquet hall's giant pillar with the four men, clutching the genetic code.","搞笑强大惊，抱着基因编码绕着宴会厅的大柱子与四人兜圈周旋。"],
        ["Just in time, Jester Strong's old grade-school friend Rooster Ben arrives. Jester once saved him from thugs with a rifle at the shooting range.","危急时，搞笑强的小学同学、旅行家斗鸡彬赶到——当年正是搞笑强用打靶步枪赶走歹徒救了他。"],
        ["Rooster Ben reaches for the family talent: bragging. He puffs out his chest and impersonates the director of the FBI.","斗鸡彬使出祖传吹牛绝活，挺胸假扮起联邦调查局局长。"],
        ["A few confident lines send the four clumsy assassins running, while Rooster Ben quietly calls the police with his other hand.","斗鸡彬几句话唬跑了四个笨杀手，另一只手还悄悄打电话报了警。"],
        ["Under Rooster Ben's cover, Jester Strong boards a helicopter with the tree's genetic code.","在斗鸡彬掩护下，搞笑强带着大肚子树的基因编码登上直升机逃走。"],

        ["They swim ashore, open the case, and discover that the “USB drive” is actually a chocolate bar!","四人游上岸打开盒子，才发现那“U 盘”竟是一块巧克力！"],
        ["The four clumsy assassins yell at the sky, furious and powerless to do anything about Jester Strong.","四个笨杀手气得对天大喊大叫，却拿搞笑强毫无办法。"],
        ["The two return to the lab and find the mastermind, the Oil King, storming in with a convoy.","两人赶回基地，却撞见幕后老板石油王带着车队闯进了实验室。"],
        ["The Oil King is actually the owner of a small oil company. He wants the tree's patent for himself and dreams of getting rich from it.","原来石油王是家小石油公司老板，想独吞大肚子树专利、靠它产油大赚一笔。"],
        ["With the tree about to be seized, Jester Strong presses a remote from the helicopter and ignites the lab's gasoline tanks.","眼看树要被抢，搞笑强在直升机上果断按下遥控器，点燃了基地的汽油罐。"],
        ["The lab becomes a towering inferno. The Oil King and his crew flee to a bare little hill.","基地霎时化作冲天火海，石油王一伙只能狼狈逃上光秃秃的小山丘。"],
        ["Jester Strong evacuated the staff and planted the incendiary devices before the dinner, just in case the prototype was stolen.","其实搞笑强赴宴前早已疏散员工、预埋了燃烧装置，就怕原型被夺。"],

        ["With the lab gone, Jester Strong thinks of his college friend Westgate, a tech genius hiding on a secret Pacific island.","基地没了，搞笑强想起大学好友西门——一位藏在太平洋秘密岛上的科技怪才。"],
        ["Their only way forward is a plane they prepared in advance, bound for Westgate Island.","眼下唯一的出路，就是开上预先备好的飞机去西门岛求助。"],
        ["They fly out over the ocean, but Rooster Ben notices that the GPS destination is nothing but open water.","两人从秘密机库开出飞机飞向大海，斗鸡彬却发现 GPS 上目的地是一片空海。"],
        ["Jester Strong explains that Westgate Island is so secret even satellites cannot photograph it. Only close friends can find it.","搞笑强解释：西门岛绝密到连人造卫星都拍不到，只有密友才找得到。"],
        ["Soon after takeoff, Rooster Ben spots an enemy plane. The Oil King called it in from the hill.","起飞不久，斗鸡彬发现后方有敌机追来——是山丘上的石油王叫来的。"],
        ["The enemy plane sprays cannon fire. Its aim is terrible, but the attack still scares them senseless.","敌机用机炮猛打，偏偏飞行员准头奇差，久攻不中，却也把两人吓得不轻。"],
        ["Wondering how their route was exposed, Jester Strong finds a listening device planted in his pocket.","搞笑强正纳闷行踪怎么暴露，忽然摸到口袋里被塞的窃听器。"],
        ["Rooster Ben gives him a look. They play along: Jester Strong tells the bug that the real code is stored in his brain through a brain-computer interface.","斗鸡彬使个眼色，两人将计就计——搞笑强对窃听器谎称“真正的编码已用脑机接口存进我脑子里”。"],
        ["Afraid the code will die with him, the Oil King orders the enemy plane to stop firing. It turns away in frustration.","石油王怕他一死密码就没了，追来的敌机果然不敢再开炮，悻悻掉头。"],
        ["Jester Strong wraps the bug in a radiation-proof suit and cuts the signal. The Oil King can hear nothing more.","搞笑强又用防辐射衣裹住窃听器切断信号，石油王再也偷听不到。"],
        ["As they approach Westgate Island, they make video contact. Westgate recognizes his old classmates and lets them in.","飞机靠近西门岛，接通视频；西门一见是老同学，便放他们进岛。"],

        ["The enemy plane cannot cross the storm wall. It turns back and reports the island's location to the Oil King.","敌机冲不过风暴墙只好返航，并把小岛的位置报告给石油王。"],

        ["After a few days of rest, they ask Westgate to invest and help improve the tree for the whole world.","歇了几天，两人想劝西门投资，把大肚子树改良并推向全球。"],
        ["But Westgate only loves inventing and collecting inventions. He has no interest in sharing technology.","偏偏西门只爱埋头搞发明、收藏发明，对推广技术毫无兴趣。"],
        ["Just as they run out of ideas, the alarm sounds: the Oil King has surrounded Westgate Island with a fleet.","正一筹莫展时，警报大作——石油王叫来一大批船只围住了西门岛。"],
        ["Westgate remains calm and presses a mysterious button.","西门却不慌不忙，气定神闲地按下一个神秘按钮。"],
        ["A flagpole rises from the main building. The metal sphere at its tip flashes with strange light.","主楼升起一根旗杆，顶端的金属球骤然发出奇异闪光。"],
        ["The surrounding ships vanish in an instant. Rooster Ben asks, “Did you burn all the ships?”","围岛的船只眨眼全消失，斗鸡彬惊问：“你把船都烧了？”"],
        ["Westgate explains with pride: it is a long-distance transporter. One flash sends every ship back to its home port.","西门得意解释：那是超距离传送器，一道闪光把船瞬移回了各自的出发港。"],
        ["The two offer to help with Westgate's energy supply, but he leads them to a power station.","两人想帮西门解决能源，西门却笑着领他们来到一座发电站前。"],
        ["It is geothermal power. Westgate drilled a shaft to the Earth's core for heat and does not need oil at all.","原来那是地热发电站——西门打了口深井直通地心，靠地热供电，压根不需要石油。"],
        ["Since Westgate has no use for the big-bellied tree, they ask him to transport them—and their plane—to somewhere with internet.","既然西门用不上大肚子树，两人便请他用传送器把自己连飞机送到能上网的地方。"],
        ["Westgate agrees and serves them a magnificent seafood feast before they leave.","西门欣然答应，还做了一顿丰盛的海鲜大餐替两人饯行。"],
        ["Before parting, Westgate gives them magical rings: point at a target, shout “Bang!”, and send it flying with no recoil.","临别，西门送给两人各一枚神奇戒指：指着目标喊声“砰！”就能击飞，还没有后坐力。"],
        ["Westgate starts the transporter, but the seafood was bad. A sudden stomach cramp makes his hand hit the wrong coordinates.","西门启动传送器，偏偏那顿海鲜不干净，他突然肚子剧痛、手一歪点错了坐标。"],
        ["The pair and their plane land by mistake in a Nevada desert town with only a gas station, a motel, and a diner.","结果两人连飞机被误送到内华达沙漠里一个只有加油站、旅馆和餐厅的小镇。"],
        ["Using the plane's satellite antenna, they get online, publish the genetic code and cultivation method across twenty major social networks, and report the Oil King. Agents arrest him soon after.","两人用飞机的卫星天线连上网，把基因密码和培养技术发上二十大社媒，并举报石油王，探员很快将他逮捕。"],
        ["The four clumsy assassins crawl back to town and see the news. They pound their chests in fury—then the phone rings.","四个笨杀手爬回镇上，从电视看到技术被公开，气得捶胸顿足——这时电话响了。"],
        ["The caller is their other employer, the White Prince. His oil monopoly dream is ruined, and he orders them to kill the two inventors.","来电的是他们的另一个雇主“白衣王子”：这位石油大亨的垄断美梦被搅黄，命四人去杀两人泄愤。"],
        ["The four clumsy assassins board the White Prince's plane, land in the desert, and charge the motel.","四个笨杀手扛枪搭上白衣王子的飞机，降落沙漠，直扑旅馆。"],

        ["Years later, big-bellied trees take root around the world: producing oil and timber, absorbing greenhouse gases, and greening barren hills. Even Westgate leaves the Pacific to raise a toast with his friends.","几年后，大肚子树在世界各地扎根：产石油、供木材、吸收温室气体、绿化荒山；连深居太平洋的西门都破例上岸，与两人举杯同庆。"]

            if(loaded) preloadedImages.add(source);

        const left = makeBookPage(spreadStart, t, "left");
        const right = makeBookPage(spreadStart + 1 <= images.length ? spreadStart + 1 : null, t, "right");
        left.title = t.previous;
        right.title = t.next;
        left.addEventListener("click", () => goToSpread(spreadStart - 2));
        right.addEventListener("click", () => goToSpread(spreadStart + 2));
        left.addEventListener("keydown", (event) => { if(event.key === "Enter" || event.key === " "){ event.preventDefault(); goToSpread(spreadStart - 2); } });
        right.addEventListener("keydown", (event) => { if(event.key === "Enter" || event.key === " "){ event.preventDefault(); goToSpread(spreadStart + 2); } });
        spread.append(left, right);
        preloadSpread(spreadStart - 2);
        preloadSpread(spreadStart + 2);
        const flip = document.createElement("div");
        flip.className = "book-flip";
        const front = document.createElement("div");
        front.className = "book-flip-face book-flip-front";
        const back = document.createElement("div");
        back.className = "book-flip-face book-flip-back";
        flip.append(front, back);
        stage.append(spread, flip);
        const hint = document.createElement("div");
        hint.className = "reader-hint";
        hint.textContent = t.flipHint;
        const controls = document.createElement("div");
        controls.className = "reader-controls";
        const previous = document.createElement("button");
        previous.type = "button";
        previous.textContent = "← " + t.previous;
        previous.disabled = spreadStart === 1;
        previous.addEventListener("click", () => goToSpread(spreadStart - 2));
        const count = document.createElement("span");
        count.className = "reader-count";
        count.textContent = t.spreadOf(spreadStart, spreadEnd);
        const next = document.createElement("button");
        next.type = "button";
        next.textContent = t.next + " →";
        next.disabled = spreadStart + 1 >= images.length;
        next.addEventListener("click", () => goToSpread(spreadStart + 2));
        controls.append(previous, count, next);
        reader.append(top, stage, hint, controls);
        comic.appendChild(reader);
      }
     function renderContinuous(t){
        acts.forEach((act) => {
          const actNode = document.createElement("section");
          actNode.className = "act";
          const heading = document.createElement("h2");
          heading.textContent = lang === "en" ? act.en : act.zh;
          actNode.appendChild(heading);
          comic.appendChild(actNode);
          for(let panelNo = act.from; panelNo <= act.to; panelNo++){
            comic.appendChild(makeCard(panelNo, false, t));
          }
        });
      }
      function render(){
        const t = copy[lang];
        document.documentElement.lang = lang === "en" ? "en" : "zh-CN";
        document.body.classList.toggle("page-mode", mode === "page");
        title.textContent = t.title;
        meta.innerHTML = t.meta;
        footer.innerHTML = t.footer;
        modeLabel.textContent = t.modeLabel;
        langLabel.textContent = lang === "en" ? "Language" : "语言";
        document.querySelector('[data-mode="page"]').textContent = t.pageMode;
        document.querySelector('[data-mode="continuous"]').textContent = t.continuousMode;
        comic.innerHTML = "";
        if(mode === "page"){
          renderPage(t);
          syncBookPageHeight(t);
        }else{
          renderContinuous(t);
        }
        document.querySelectorAll("[data-mode]").forEach((button) => {
          const active = button.dataset.mode === mode;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
        document.querySelectorAll("[data-lang]").forEach((button) => {
          const active = button.dataset.lang === lang;
          button.classList.toggle("active", active);
          button.setAttribute("aria-pressed", String(active));
        });
      }
      document.querySelectorAll("[data-lang]").forEach((button) => button.addEventListener("click", () => {
        lang = button.dataset.lang;
        localStorage.setItem("comic-language", lang);
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      }));
      document.querySelectorAll("[data-mode]").forEach((button) => button.addEventListener("click", () => {
        mode = button.dataset.mode;
        localStorage.setItem("comic-mode", mode);
        render();
        window.scrollTo({top:0,behavior:"smooth"});
      }));
      document.addEventListener("keydown", (event) => {
        if(mode !== "page" || ["BUTTON","INPUT","TEXTAREA"].includes(event.target.tagName)) return;
        if(event.key === "ArrowLeft") goToSpread(currentPanel - 2);
        if(event.key === "ArrowRight") goToSpread(currentPanel + 2);
      });
      let resizeTimer;
      window.addEventListener("resize", () => {
        if(mode !== "page") return;
        window.clearTimeout(resizeTimer);
        resizeTimer = window.setTimeout(() => syncBookPageHeight(copy[lang]), 120);
      });
      render();
    </script>
  </body>
</html>
